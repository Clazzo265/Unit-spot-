name: Deploy Firebase Rules

on:
  push:
    branches:
      - main
      - arena/7fd7d37a-unit-spot
    paths:
      - firestore.rules
      - storage.rules
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-rules
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Firestore and Storage rules
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy rules
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ] || [ -z "$FIREBASE_TOKEN" ]; then
            echo "Set FIREBASE_PROJECT_ID and FIREBASE_TOKEN repository secrets first."
            exit 1
          fi
          npx --yes firebase-tools@latest deploy \
            --only firestore:rules,storage \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --non-interactive
