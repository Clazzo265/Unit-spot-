<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNIT SPOT</title>
    <script>
      // GitHub Pages serves this file for unknown paths. The app routes with
      // query strings/hashes only, so send visitors back to index.html
      // without losing an invite code (?join=...) or hash link.
      location.replace('./index.html' + location.search + location.hash);
    </script>
  </head>
  <body>
    <p>Redirecting to UNIT SPOT…</p>
    <a href="./index.html">Open UNIT SPOT</a>
  </body>
</html>
